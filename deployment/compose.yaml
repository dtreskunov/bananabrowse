services:
  domagent:
    build: ..
    restart: unless-stopped
    ports:
      - "127.0.0.1:18792:18792"
    environment:
      DOMAGENT_ORIGIN: "${DOMAGENT_ORIGIN:?Set the canonical HTTPS origin}"
      DOMAGENT_BIND: 0.0.0.0
      DOMAGENT_DB: /var/lib/domagent/domagent.db
      # Empty = remote administration disabled. Keep the env file private/gitignored.
      DOMAGENT_OPERATOR_SECRET: "${DOMAGENT_OPERATOR_SECRET:-}"
      DOMAGENT_PROTECTED_ORIGINS: "${DOMAGENT_PROTECTED_ORIGINS:-}"
    volumes:
      - domagent-data:/var/lib/domagent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: journald
      options:
        tag: domagent
volumes:
  domagent-data:
