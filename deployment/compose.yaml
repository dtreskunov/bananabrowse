services:
  domagent:
    build: ..
    restart: unless-stopped
    ports:
      - "127.0.0.1:18792:18792"
    environment:
      DOMAGENT_ORIGIN: "${DOMAGENT_ORIGIN:?Set the canonical HTTPS origin}"
      DOMAGENT_BIND: 0.0.0.0
      DOMAGENT_DB: /var/lib/domagent/domagent.db
      DOMAGENT_PROTECTED_ORIGINS: "${DOMAGENT_PROTECTED_ORIGINS:-}"
    # Agent entries (DOMAGENT_AGENT_<ID>) live in a private, gitignored env file.
    env_file:
      - path: ./domagent.env
        required: false
    volumes:
      - domagent-data:/var/lib/domagent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: journald
      options:
        tag: domagent
volumes:
  domagent-data:
