<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DomAgent workspace</title><link rel="stylesheet" href="ui.css"><script src="ui.js" defer></script></head>
<body class="panel">
<h1>DomAgent</h1><p id="status" role="status">Getting ready...</p>
<p id="error" role="alert"></p><div id="targets"></div>
<details><summary>Recent activity</summary><div id="activity"></div></details>
<details><summary>Settings and connection</summary><p id="identity"></p>
<div id="connections"></div>
<button id="options" type="button">Pairing settings</button>
<button id="connect" type="button">Reconnect</button><button id="disconnect" type="button">Disconnect</button></details>
<p class="warning">Grouped tabs can be controlled in the background, including page scripts.
Your normal logins are used. Closing this sidebar ends control and leaves tabs open.
Prior requests/account changes cannot be undone.</p>
</body></html>
