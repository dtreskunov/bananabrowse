services:
  bananabrowse:
    build: ..
    restart: unless-stopped
    ports:
      - "127.0.0.1:18792:18792"
    environment:
      BANANABROWSE_ORIGIN: "${BANANABROWSE_ORIGIN:?Set the canonical HTTPS origin}"
      BANANABROWSE_BIND: 0.0.0.0
      BANANABROWSE_DB: /var/lib/bananabrowse/bananabrowse.db
      BANANABROWSE_PROTECTED_ORIGINS: "${BANANABROWSE_PROTECTED_ORIGINS:-}"
    # Agent entries (BANANABROWSE_AGENT_<ID>) live in a private, gitignored env file.
    env_file:
      - path: ./bananabrowse.env
        required: false
    volumes:
      - bananabrowse-data:/var/lib/bananabrowse
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: journald
      options:
        tag: bananabrowse
volumes:
  bananabrowse-data:
